<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aprovação de Arte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap">
<style>
/* Layout: portal de revisão com cinco páginas (visão geral, anúncios por fase, feed, stories e reels, correções) e uma tela de revisão com o celular à esquerda e decisão, mudanças e comentários à direita. */
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #f0f0ec;
  --line: #e2e2db;
  --ink: #16160f;
  --muted: #6a6a60;
  --accent: #16160f;
  --on-accent: #ffffff;
  --gold: #d9a521;
  --ok: #17703f;
  --ok-bg: #e2f3e8;
  --alt: #8f5600;
  --alt-bg: #fcefd2;
  --bad: #b3302a;
  --bad-bg: #fbe4e1;
  --pend: #5f5f56;
  --pend-bg: #ebebe6;
  --ring-ok: #2cae68;
  --ring-alt: #d9a521;
  --ring-bad: #e0483f;
  --ring-pub: #3b82f6;
  --ring-pend: #ffffff;
  --pub: #1f5fc4;
  --pub-bg: #e1ecfb;
  --shadow: 0 1px 2px rgba(22,22,15,.06), 0 8px 24px rgba(22,22,15,.06);
  --font-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-cond: "Anton", "Arial Narrow", Impact, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e0b; --surface: #17170f; --surface-2: #20201a; --line: #2e2e26;
    --ink: #f1f0e8; --muted: #9d9c8f; --accent: #f1f0e8; --on-accent: #16160f;
    --ok: #62d394; --ok-bg: #12301f; --alt: #f0b64e; --alt-bg: #36280c;
    --bad: #ff8d84; --bad-bg: #3a1613; --pend: #a8a79a; --pend-bg: #25251e;
    --pub: #8db8ff; --pub-bg: #12233f; --ring-pend: #d9d8cf;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e0b; --surface: #17170f; --surface-2: #20201a; --line: #2e2e26;
  --ink: #f1f0e8; --muted: #9d9c8f; --accent: #f1f0e8; --on-accent: #16160f;
  --ok: #62d394; --ok-bg: #12301f; --alt: #f0b64e; --alt-bg: #36280c;
  --bad: #ff8d84; --bad-bg: #3a1613; --pend: #a8a79a; --pend-bg: #25251e;
  --pub: #8db8ff; --pub-bg: #12233f; --ring-pend: #d9d8cf;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 96px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 1180px; margin-inline: auto; }

/* topo e navegação */
.top { display: flex; align-items: center; gap: 12px 24px; padding-block: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: #1a1507; display: grid; place-items: center; font-family: var(--font-serif); font-weight: 700; font-size: 18px; flex: none; }
.brand b { display: block; font-weight: 700; line-height: 1.2; }
.brand span { display: block; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.top-r { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.savestate { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.savestate i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.savestate.saving i { background: var(--gold); }
.savestate.local i { background: var(--alt); }
.who { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 14px 5px 6px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; }
.who i { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-style: normal; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.who small { color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; }
.nav button { background: none; border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 700; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.nav .badge { font-size: 12px; font-weight: 800; background: var(--alt-bg); color: var(--alt); border-radius: 99px; padding: 1px 8px; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
/* início */
.home-h { display: grid; gap: 6px; margin-bottom: 18px; }
.chip .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
.sw-pending { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--muted); }
.sw-approved { background: var(--ring-ok); } .sw-altered { background: var(--ring-alt); } .sw-rejected { background: var(--ring-bad); } .sw-published { background: var(--ring-pub); }
.mason { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 14px; align-items: start; padding: 4px; }
.mcol { display: grid; gap: 14px; align-content: start; min-width: 0; }
.tile { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: var(--surface-2); box-shadow: 0 0 0 3px var(--ring-pend), 0 0 0 4px var(--line); transition: transform .15s; text-align: left; }
.tile:hover, .tile:focus-visible { transform: translateY(-2px); }
.tile.approved { box-shadow: 0 0 0 3px var(--ring-ok); }
.tile.altered { box-shadow: 0 0 0 3px var(--ring-alt); }
.tile.rejected { box-shadow: 0 0 0 3px var(--ring-bad); }
.tile.published { box-shadow: 0 0 0 3px var(--ring-pub); }
.tile .art { border-radius: 0; }
.tbadge { position: absolute; top: 8px; left: 8px; z-index: 2; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.tbadge.approved { background: #17703f; } .tbadge.altered { background: #d9a521; color: #1a1507; } .tbadge.rejected { background: #b3302a; } .tbadge.published { background: #1f5fc4; }
.ticon { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); z-index: 2; }
.ov { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 10px 10px; background: linear-gradient(transparent, rgba(0,0,0,.78)); color: #fff; font-size: 12.5px; font-weight: 700; line-height: 1.25; opacity: 0; transition: opacity .15s; z-index: 3; }
.ov small { display: block; font-weight: 500; opacity: .85; font-size: 11.5px; margin-top: 2px; }
.tile:hover .ov, .tile:focus-visible .ov { opacity: 1; }
.pill.published { color: var(--pub); background: var(--pub-bg); }
.mini.published .mini-box { box-shadow: 0 0 0 3px var(--ring-pub); }
.pcell .stat.published { background: var(--ring-pub); }
.bar .s-published { background: var(--ring-pub); }
.pubbanner { background: var(--pub-bg); color: var(--pub); border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
/* miniaturas: sempre 4:5, só o título, em tamanho legível */
.art.tmode { aspect-ratio: 4 / 5 !important; padding: 8cqw !important; justify-content: center; }
.tmode .a-top, .tmode .a-foot, .tmode .a-b { display: none !important; }
.tmode .a-main { flex: none; padding: 0 !important; align-content: center; gap: 0; }
.tmode .a-h { font-size: var(--tsz, 11cqw) !important; line-height: 1.06 !important; }
.tmode .play::before { width: 22cqw; height: 22cqw; }
.tmode .play::after { border-width: 4.6cqw 0 4.6cqw 7.6cqw; }
.mini-box.st .art, .cc-h .mini-box.st .art { width: 100%; aspect-ratio: 4 / 5; border-radius: 0; }
.mini-box.st { aspect-ratio: 4 / 5; }
.sec.others { margin-top: 44px; border-top: 1px solid var(--line); padding-top: 28px; }
.others .minis { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
@media (max-width: 760px) { .brand { order: 1; } .top-r { order: 2; margin-left: auto; } .nav { order: 3; flex-basis: 100%; flex: none; } }
h1 { font-size: clamp(24px, 3.4vw, 34px); line-height: 1.1; margin: 0; letter-spacing: -.02em; font-weight: 800; text-wrap: balance; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 0; font-weight: 700; color: var(--muted); }
h3 { font-size: 18px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 62ch; margin-top: 6px; }

/* resumo */
.sum { padding: 20px; display: grid; gap: 16px; }
.sum-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sum-num { font-size: 14px; color: var(--muted); }
.sum-num strong { font-size: 30px; color: var(--ink); font-weight: 800; letter-spacing: -.02em; margin-right: 4px; font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--pend-bg); gap: 2px; }
.bar.sm { height: 6px; }
.bar span { display: block; min-width: 0; transition: flex-grow .3s; }
.bar .s-approved { background: var(--ring-ok); }
.bar .s-altered { background: var(--ring-alt); }
.bar .s-rejected { background: var(--ring-bad); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend b { font-variant-numeric: tabular-nums; }
.secstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.secstat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; text-align: left; background: var(--surface); }
.secstat:hover { border-color: var(--ink); }
.secstat b { font-size: 14px; }
.secstat span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* seções */
.sec { margin-top: 36px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head .meta-s { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.sub { margin-top: 22px; }
.sub-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.sub-h b { font-size: 14.5px; }
.sub-h span { color: var(--muted); font-size: 13px; }
.stagebox { padding: 14px 16px; display: grid; gap: 10px; margin-bottom: 14px; }
.stagebox .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.stagebox .row span { color: var(--muted); font-size: 13.5px; }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.mini { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 6px; align-content: start; }
.mini-box { position: relative; aspect-ratio: 4 / 5; display: grid; place-items: center; background: var(--surface-2); border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); transition: transform .15s; }
.mini:hover .mini-box { transform: translateY(-2px); }
.mini-box .art { border-radius: 0; }
.mini-box.st .art { width: 70.3%; aspect-ratio: 9 / 16; border-radius: 4px; }
.mini.approved .mini-box { box-shadow: 0 0 0 3px var(--ring-ok); }
.mini.altered .mini-box { box-shadow: 0 0 0 3px var(--ring-alt); }
.mini.rejected .mini-box { box-shadow: 0 0 0 3px var(--ring-bad); }
.mini .nf { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.72); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 99px; padding: 1px 7px; }
.mini-l { font-size: 12px; color: var(--muted); line-height: 1.25; }
.mini-l b { display: block; color: var(--ink); font-size: 12.5px; }

/* filtros */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-block: 4px 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 18px; }
.item { text-align: left; padding: 0; display: flex; flex-direction: column; overflow: hidden; transition: transform .15s, box-shadow .15s, border-color .15s; width: 100%; }
.item:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.thumb { position: relative; background: var(--surface-2); display: block; }
.thumb.is-story { display: grid; place-items: center; padding: 14px; aspect-ratio: 4 / 5; }
.thumb.is-story .art { width: 70.3%; border-radius: 10px; }
.thumb .kind { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.72); color: #fff; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; letter-spacing: .02em; }
.meta { display: grid; gap: 8px; padding: 14px; }
.meta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-title { font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item-sub { font-size: 13px; color: var(--muted); }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag { font-size: 11.5px; font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
.byline { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.pending { color: var(--pend); background: var(--pend-bg); }
.pill.approved { color: var(--ok); background: var(--ok-bg); }
.pill.altered { color: var(--alt); background: var(--alt-bg); }
.pill.rejected { color: var(--bad); background: var(--bad-bg); }
.pill.applied { color: var(--ok); background: var(--ok-bg); }
.pill.applied::before { content: "✓"; width: auto; height: auto; background: none; font-size: 11px; }

.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; max-width: 560px; margin-inline: auto; background: var(--surface); padding: 3px; border-radius: 12px; border: 1px solid var(--line); }
.pcell { position: relative; padding: 0; border: 0; display: block; background: var(--surface-2); }
.pcell .stat { position: absolute; top: 8px; right: 8px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; background: var(--pend); }
.pcell .stat.approved { background: var(--ring-ok); } .pcell .stat.altered { background: var(--ring-alt); } .pcell .stat.rejected { background: var(--ring-bad); }
.pcell svg { position: absolute; top: 8px; left: 8px; width: 18px; height: 18px; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.pnote { text-align: center; font-size: 13px; color: var(--muted); margin-top: 12px; }

.submit { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(8px); z-index: 20; }
.submit-in { max-width: 1180px; margin-inline: auto; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.submit-in p { font-size: 14px; color: var(--muted); min-width: 0; }
.submit-in p b { color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); font-size: 13px; }
.notice { margin-top: 16px; padding: 12px 16px; border-radius: 10px; background: var(--alt-bg); color: var(--alt); font-size: 14px; font-weight: 600; }
.sent { margin-top: 16px; padding: 12px 16px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-size: 14px; font-weight: 600; }

/* identificação */
.gate { position: fixed; inset: 0; background: rgba(10,10,6,.55); display: grid; place-items: center; padding: 16px; z-index: 60; }
.gatebox { padding: 24px; width: min(100%, 420px); display: grid; gap: 12px; box-shadow: var(--shadow); }
.gatebox label { font-weight: 700; font-size: 13.5px; display: block; margin-bottom: 4px; }
.gatebox p { color: var(--muted); font-size: 14px; }

/* revisão */
.rv-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; }
.rv-title { display: flex; align-items: center; gap: 10px; font-weight: 700; flex-wrap: wrap; }
.rv-title small { font-weight: 500; color: var(--muted); font-size: 13.5px; }
.rv-nav { display: flex; gap: 8px; }
.rv-body { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 28px; align-items: start; }
.stage { position: sticky; top: 16px; display: grid; justify-items: center; gap: 12px; min-width: 0; }
.phone { width: 100%; max-width: 400px; border: 9px solid #15150f; border-radius: 40px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); position: relative; }
.phone.is-story { max-width: 330px; }
:root[data-theme="dark"] .phone { border-color: #34342b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .phone { border-color: #34342b; } }
.notch { height: 24px; display: grid; place-items: center; background: var(--surface); }
.is-story .notch { position: absolute; top: 0; left: 0; right: 0; z-index: 6; background: transparent; }
.notch i { width: 84px; height: 16px; border-radius: 99px; background: #15150f; display: block; }
.ig-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: #1a1507; font-family: var(--font-serif); font-weight: 700; display: grid; place-items: center; flex: none; }
.ig-name { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 4px; line-height: 1.2; }
.ig-sub { font-size: 12px; color: var(--muted); line-height: 1.2; }
.ig-more { margin-left: auto; letter-spacing: 2px; color: var(--muted); font-weight: 800; }
.ig-media { position: relative; background: var(--surface-2); overflow: hidden; touch-action: pan-y; }
.track { display: flex; transition: transform .35s cubic-bezier(.3,.7,.2,1); }
.cell { flex: 0 0 100%; min-width: 0; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255,255,255,.88); color: #15150f; font-weight: 800; z-index: 5; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.arrow.l { left: 8px; } .arrow.r { right: 8px; }

      else if (f === 'h' || f === 'b') { var i = +t.getAttribute('data-i'); v.slides[i][f] = t.value; refreshArt(item, i); goSlide(i); }
      else v.ad[f] = t.value;
      r.editedBy = me(); r.editedAt = nowIso();
      refreshCaption(item); updateEdited(item); updateCounts(item); updateHint(item); touch(item.id);
    });
    panel.addEventListener('change', function (e) {
      if (e.target.id === 'cta') { var v = ensureVals(item), r = rec(item.id); v.ad.cta = e.target.value; r.editedBy = me(); r.editedAt = nowIso(); refreshCaption(item); updateEdited(item); updateHint(item); touch(item.id); }
    });
    panel.addEventListener('focusin', function (e) { var sf = e.target.closest('.sf'); if (sf) goSlide(+sf.getAttribute('data-i')); });
    panel.addEventListener('click', function (e) {
      var d = e.target.closest('[data-del]'); if (!d) return;
      var r = rec(item.id); r.pins.splice(+d.getAttribute('data-del'), 1); touch(item.id); renderPins(item); updateHint(item);
    });
  }

  /* eventos globais */
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]'); if (g) { state.annotate = false; go(g.getAttribute('data-go')); return; }
    if (e.target.closest('#who')) { showGate(); return; }
    var o = e.target.closest('[data-open]'); if (o) { openItem(o.getAttribute('data-open')); return; }
    if (state.view !== 'page') return;
    var f = e.target.closest('[data-filter]'); if (f) { state.filter = f.getAttribute('data-filter'); renderPage(); return; }
    var l = e.target.closest('[data-layout]'); if (l) { state.layout = l.getAttribute('data-layout'); renderPage(); return; }
    var cf = e.target.closest('[data-cf]'); if (cf) { state.cfilter = cf.getAttribute('data-cf'); state.sumtext = ''; renderPage(); return; }
    var ap = e.target.closest('[data-apply]'); if (ap) { var id = ap.getAttribute('data-apply'), r = rec(id); if (r.applied) delete r.applied; else r.applied = { by: me(), at: nowIso() }; touch(id); renderPage(); updateNav(); return; }
    if (e.target.closest('#copysum')) {
      var act = ALL.filter(hasActivity), list = sorted(state.cfilter === 'open' ? act.filter(needsAction) : state.cfilter === 'applied' ? act.filter(function (i) { var r = peek(i.id); return r && r.applied; }) : act);
      var txt = summaryText(list);
      var fail = function () { state.sumtext = txt; renderPage(); var t = $('#sumtxt'); if (t) { t.focus(); t.select(); } };
      try { navigator.clipboard.writeText(txt).then(function () { toast('Resumo copiado'); }, fail); } catch (er) { fail(); }
      return;
    }
    if (e.target.closest('#send')) {
      var c = counts(ALL), body = { at: nowIso(), by: me(), day: reviewer && reviewer.day || '', total: ALL.length, approved: c.approved, altered: c.altered, rejected: c.rejected };
      submission = body; renderPage(); toast('Revisão enviada');
      if (dbApi && !state.localOnly) dbApi.doc('meta/submission').set(body).catch(function () { state.localOnly = true; saveLocal(); });
      else saveLocal();
      return;
    }
    if (e.target.closest('#reopen')) {
      submission = null; renderPage();
      if (dbApi && !state.localOnly) dbApi.doc('meta/submission').delete().catch(function () {}); else saveLocal();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (state.view !== 'review') return;
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    if (e.key === 'ArrowRight') goSlide(state.slide + 1);
    else if (e.key === 'ArrowLeft') goSlide(state.slide - 1);
    else if (e.key === 'Escape') { state.annotate = false; go(state.from || 'visao'); }
  });

  /* início */
  loadWho();
  applyToken((location.hash || '').slice(1));
  render(); setSave('saved');
  if (!reviewer) showGate();
  try { window.matchMedia('(min-width: 860px)').addEventListener('change', function () { if (state.view === 'page' && state.page === 'overview') renderPage(); }); } catch (e) {}
  var p;
  try { p = window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null); } catch (e) { p = Promise.resolve(null); }
  p.then(function (db) {
    if (db) startDb(db); else { state.localOnly = true; loadLocal(); setSave('local'); onData(); }
  }, function () { state.localOnly = true; loadLocal(); setSave('local'); onData(); });
  try {
    var up = window.claude && window.claude.use ? window.claude.use('user') : null;
    if (up) up.then(function (u) { userApi = u; if (state.view === 'page') renderPage(); else updateApply(curItem()); }, function () {});
  } catch (e) {}
})();
</script>

</body></html>
