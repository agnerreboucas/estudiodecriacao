<div class="app">
<div class="rail-back" id="railBack" onclick="railToggle(false)"></div>
<aside class="rail" id="rail" aria-label="Menu principal">
  <div class="logo">S</div>
  <nav class="rail-nav">
    <button class="active" data-page="home" title="Início"><span data-ico="home"></span><span class="rail-lb">Início</span></button>
    <button data-page="briefing" title="Briefing do cliente"><span data-ico="inbox"></span><span class="rail-lb">Briefing do cliente</span></button>
    <button data-page="templates" title="Banco de templates"><span data-ico="layout"></span><span class="rail-lb">Banco de templates</span></button>
    <button data-page="dev" title="Desenvolvimento"><span data-ico="globe"></span><span class="rail-lb">Desenvolvimento</span></button>
    <button data-page="refs" title="Referências"><span data-ico="library"></span><span class="rail-lb">Referências</span></button>
    <button data-page="mesa" title="Mesa de páginas"><span data-ico="grid"></span><span class="rail-lb">Mesa de páginas</span></button>
    <button data-page="biblioteca" title="Imagens"><span data-ico="image"></span><span class="rail-lb">Imagens</span></button>
  </nav>
  <div class="rail-bottom">
    <button data-page="settings" title="Configurações"><span data-ico="settings"></span><span class="rail-lb">Configurações</span></button>
    <button type="button" class="rail-mini-btn" id="railMini" title="Recolher o menu" onclick="railMini()">◀ <span class="rail-lb2">Recolher</span></button>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <button class="top-btn burger" id="burger" onclick="railToggle()" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
  <div class="nav-btns"><button class="top-btn" id="navBack" onclick="navBack()" title="Voltar" disabled>‹ Voltar</button><button class="top-btn" id="navFwd" onclick="navFwd()" title="Avançar" disabled>Avançar ›</button></div>
  <button class="top-btn" onclick="go('settings');setTimeout(()=>{const e=$('integracoesRoot');if(e)e.scrollIntoView()},80)" title="Chaves das APIs">🔌 APIs</button>
  <button class="top-btn sync-badge local" id="syncBadge" onclick="syncBadgeClick()">● Local</button>
  <span id="credits" hidden>0</span>
</header>
<section id="page-home" class="page active"><div class="subpage dz-wide" id="homeRoot"></div><div class="masonry" id="homeGallery" hidden></div><button id="contextButton" hidden></button><small id="contextHint" hidden></small></section>
<section id="page-projects" class="page"><div class="subpage">
  <div class="page-head"><div><h1>Projetos</h1><p>Cada projeto é um cliente ou negócio. Os sites e landing pages ficam dentro dele.</p></div></div>
  <div id="projectsBar" style="margin:0 0 10px;display:flex;justify-content:flex-end"></div>
  <div class="project-grid" id="projectsGrid"></div></div></section>
<section id="page-briefing" class="page"><div class="subpage dz-wide" id="briefingRoot"></div></section>
<section id="page-templates" class="page"><div class="subpage dz-wide" id="templatesRoot"></div></section>
<section id="page-dev" class="page"><div class="subpage dz-wide" id="devRoot"></div></section>
<section id="page-refs" class="page"><div class="subpage dz-wide" id="refsRoot"></div></section>
<section id="page-cliente" class="page"><div id="clienteRoot"></div></section>
<section id="page-landings" class="page"><div class="subpage dz-wide" id="landingsRoot"></div></section>
<section id="page-mesa" class="page"><div class="subpage" id="mesaRoot"></div></section>
<section id="page-biblioteca" class="page"><div class="subpage dz-wide" id="bibliotecaRoot"></div></section>
<section id="page-settings" class="page"><div class="subpage" id="settingsRoot"></div></section>
</main>
</div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<div class="overlay" id="overlay"><div class="overlay-bar"><strong id="overlayTitle"></strong><div class="row-gap"><button class="btn sm" onclick="overlayDownload()">⬇ Baixar HTML</button><button class="btn sm" onclick="overlayPrint()">Imprimir / PDF</button><button class="btn sm dark" onclick="closeOverlay()">Fechar</button></div></div><iframe id="overlayFrame" title="Pré-visualização" allow="fullscreen"></iframe></div>
<input type="file" id="importFile" accept="application/json,.json,.ampliacao,.zip" hidden onchange="if(this.files[0])importFile(this.files[0]);this.value=''">
