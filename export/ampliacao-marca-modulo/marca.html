<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marca: valores, arquétipo e voz</title>
<style>
:root{--ink:#141414;--mut:#5f6368;--line:#e3e3e8;--bg:#f5f5f7;--card:#fff;--ac:#111;--ok:#176b30;--bad:#b3472f}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 90px}
header.top{padding:26px 0 10px}header.top h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0 0 8px}header.top p{margin:0;color:var(--mut)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.prog{height:8px;background:#e6e6ea;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.bar small{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:5px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;flex:none}
details.sec>summary .st{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut)}details.sec.ok>summary .st{color:var(--ok)}
.body{padding:2px 16px 16px;border-top:1px solid var(--line)}.body>p.d{color:var(--mut);font-size:14px;margin:10px 0 2px}
.f{margin:14px 0 0}.f label,.f .l{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}.f .req{color:var(--bad)}
input[type=text],input[type=tel],input[type=email],input[type=url],select,textarea{width:100%;border:1.5px solid #cfd0d6;border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:inherit}
textarea{min-height:92px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #1118;outline-offset:1px;border-color:#111}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{display:inline-flex;align-items:center;gap:7px;border:1.5px solid #cfd0d6;border-radius:99px;padding:7px 13px;font-weight:500;cursor:pointer;margin:0;font-size:14.5px}
.chk input{width:auto}.chk label:has(input:checked){background:#111;color:#fff;border-color:#111}
.it{border:1.5px dashed #c9c9d0;border-radius:12px;padding:4px 14px 14px;margin:14px 0}.it h4{margin:12px 0 0;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;cursor:pointer}.btn{border:1.5px solid #111;background:#fff;border-radius:10px;padding:10px 16px;font-weight:700}.btn.dark{background:#111;color:#fff}.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}.acc label{display:flex;gap:10px;align-items:flex-start;font-size:15px}.acc input{margin-top:5px;width:18px;height:18px;flex:none}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.msg{border-radius:10px;padding:11px 14px;margin:10px 0;font-size:14.5px}.msg.bad{background:#fbeae6;color:var(--bad)}.msg.ok{background:#e9f7ee;color:var(--ok)}
.done{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;margin:18px 0}.done .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:32px;margin:0 auto 12px}
.err{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;margin:40px 0}
.save{font-size:13px;color:var(--mut)}
.up{border:1.5px dashed #c9c9d0;border-radius:12px;padding:12px 14px;margin:14px 0}.up h4{margin:0 0 8px;font-size:15px}
.th{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.th figure{margin:0;position:relative;width:96px}.th img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#eee;display:block}
.th .pdf{width:96px;height:96px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;background:#fff}
.th figcaption{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.th button{position:absolute;top:4px;right:4px;border:0;background:#000b;color:#fff;border-radius:50%;width:22px;height:22px;line-height:20px;padding:0}
.pick{display:inline-block;border:1.5px solid #111;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}.pick input{display:none}
.arq{background:#f4f1ea;border-radius:12px;padding:12px 14px;margin:16px 0 0;font-size:14.5px}.arq b{font-size:17px}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="err">Carregando…</div></div>
<script src="js/identidade-data.js"></script>
<script src="js/identidade-guia.js"></script>
<script src="js/briefing-form.js"></script>
<script src="js/xlsx-mini.js"></script>
<script src="js/marca-planilha.js"></script>
<script>
(function () {
  var root = document.getElementById('root'), T = (new URLSearchParams(location.search).get('t') || '').trim(), A = {}, info = {name: '', status: 'rascunho'}, timer = null, saving = false, dirty = false, savedAt = '', sent = false;
  var esc = idEsc, F = mpFields();
  function api(body, get) {
    var opt = get ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)};
    return fetch('api/briefing.php' + (get ? '?t=' + encodeURIComponent(T) : ''), opt).then(function (r) { return r.json().catch(function () { return {ok: false, error: 'Resposta inesperada do servidor.'}; }); });
  }
  function val(path) { var v = mpGet(A, path); return v; }
  function put(path, v) { mpPut(A, path, v); }
  var SECS = [
    {t: '1 · Valores', d: 'Clique nos valores que são de verdade da empresa (ou de quem a comanda), os que ela defenderia mesmo perdendo dinheiro. Escolha de 5 a 7.', k: ['identidade.valores', 'identidade.valoresExtra']},
    {t: '2 · Atitudes', d: 'Agora, como a empresa age no dia a dia. Clique no que combina. Escolha de 5 a 7.', k: ['identidade.atitudes', 'identidade.atitudesExtra']},
    {t: '3 · Tom de voz', d: 'Mova cada item para o lado em que a empresa se parece mais.', k: ['identidade.t_formal', 'identidade.t_humor', 'identidade.t_tecnico', 'identidade.t_calor', 'identidade.t_ousadia']},
    {t: '4 · Seu arquétipo', d: 'Veja abaixo o que as suas escolhas indicam. Se não se reconhecer, escolha o seu.', k: ['identidade.arq', 'identidade.arq2'], result: true},
    {t: '5 · Voz e palavras', d: 'Escreva uma ideia por linha. Pode deixar em branco o que não souber.', k: ['identidade.fala', 'identidade.naoFala', 'identidade.atitudeTem', 'identidade.atitudeNao', 'identidade.admira', 'identidade.repudia', 'identidade.usa', 'identidade.naoUsa']},
    {t: '6 · Marcas que você admira', d: 'Marcas que se parecem com a sua, ou que você gostaria de lembrar. Clique nos nomes do resultado acima para ver a comunicação delas.', k: ['referencias.admira', 'contato.nome']}
  ];
  function field(f) {
    var path = f.k, v = val(path), id = 'f_' + path.replace(/\./g, '_'), lab = esc(f.q);
    if (f.t === 'area') return '<div class="f"><label for="' + id + '">' + lab + '</label><textarea id="' + id + '" data-p="' + path + '">' + esc(v) + '</textarea></div>';
    if (f.t === 'select') return '<div class="f"><label for="' + id + '">' + lab + '</label><select id="' + id + '" data-p="' + path + '"><option value="">Escolha…</option>' + f.o.map(function (o) { return '<option ' + (v === o ? 'selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></div>';
    if (f.t === 'checks') { var cur = Array.isArray(v) ? v : []; return '<div class="f"><span class="l">' + lab + '</span><div class="chk">' + f.o.map(function (o) { return '<label><input type="checkbox" data-c="' + path + '" value="' + esc(o) + '" ' + (cur.indexOf(o) >= 0 ? 'checked' : '') + '> ' + esc(o) + '</label>'; }).join('') + '</div></div>'; }
    return '<div class="f"><label for="' + id + '">' + lab + '</label><input id="' + id + '" type="text" data-p="' + path + '" value="' + esc(v) + '"></div>';
  }
  function fld(k) { return F.filter(function (x) { return x.k === k; })[0]; }
  function secDone(s) { return s.k.some(function (k) { var v = val(k); return Array.isArray(v) ? v.length : String(v || '').trim(); }); }
  function count(k) { var v = val(k); return Array.isArray(v) ? v.length : 0; }
  function resultHtml() {
    var r = mpResult(A); if (!r.main) return '<div class="arq">Escolha alguns valores e atitudes (passos 1 e 2) para ver o resultado.</div>';
    return idRolesHTML(r);
  }
  function render(keepOpen) {
    var open = {}; if (keepOpen) [].forEach.call(root.querySelectorAll('details.sec'), function (d) { open[d.dataset.i] = d.open; });
    var h = '<header class="top"><h1>Marca: valores, arquétipo e voz' + (info.name ? ' · ' + esc(info.name) : '') + '</h1><p>Responda com calma. Tudo é salvo sozinho e você pode voltar a este link quando quiser. Não existe resposta certa ou errada.</p></header>';
    h += '<div class="bar"><div class="prog"><i id="prog"></i></div><small><span id="progT"></span><span class="save" id="saveT"></span></small></div>';
    h += idIntroHTML();
    h += '<div class="act" style="margin-top:0"><button class="btn sm" type="button" id="guide">📘 Guia dos 12 arquétipos (PDF)</button></div>';
    if (sent) h += '<div class="done"><div class="ck">✓</div><h2 style="margin:0 0 6px">Enviado, obrigado!</h2><p style="margin:0;color:var(--mut)">Recebemos as suas respostas. Se quiser mudar algo, edite abaixo e envie de novo.</p></div>';
    SECS.forEach(function (s, i) {
      h += '<details class="sec" data-i="' + i + '" ' + ((keepOpen ? open[i] : i === 0) ? 'open' : '') + '><summary><span class="n">' + (i + 1) + '</span>' + esc(s.t.replace(/^\d · /, '')) + '<span class="st"></span></summary><div class="body"><p class="d">' + esc(s.d) + '</p>';
      if (s.result) h += '<div id="res">' + resultHtml() + '</div>';
      h += s.k.map(function (k) { var f = fld(k); return f ? field(f) : ''; }).join('');
      if (/valores$|atitudes$/.test(s.k[0])) h += '<p class="d" id="cnt_' + i + '">' + cntText(s.k[0]) + '</p>';
      h += '</div></details>';
    });
    h += '<div class="acc"><label><input type="checkbox" id="aceite" ' + (A.aceite ? 'checked' : '') + '><span>Autorizo o uso destas informações para elaborar o projeto de marketing da minha empresa.</span></label></div>';
    h += '<div id="msg"></div><div class="act"><button class="btn dark" id="send" type="button">' + (sent ? 'Enviar novamente' : 'Enviar') + '</button><button class="btn" id="saveNow" type="button">Salvar agora</button><button class="btn" id="xlsx" type="button">⬇ Planilha (.xlsx)</button><button class="btn" id="rep" type="button">📄 Meu relatório (PDF)</button></div>';
    h += '<p class="d" style="color:var(--mut);font-size:13px">A planilha é um jeito alternativo: baixe, preencha no Excel ou Google Planilhas e envie para quem pediu. Tudo o que você responde aqui fica salvo na nuvem, neste link.</p>';
    root.innerHTML = h; progress();
  }
  function cntText(k) { var n = count(k) + count(k + 'Extra'); return n + ' escolhido(s). ' + (n < 5 ? 'Escolha de 5 a 7.' : n > 7 ? 'Tente ficar entre 5 e 7: quanto menos, mais claro.' : 'Está bom.'); }
  function progress() {
    var done = SECS.filter(secDone).length, n = SECS.length, p = document.getElementById('prog'); if (p) p.style.width = Math.round(done / n * 100) + '%';
    var t = document.getElementById('progT'); if (t) t.textContent = done + ' de ' + n + ' partes preenchidas';
    [].forEach.call(root.querySelectorAll('details.sec'), function (d) { var ok = secDone(SECS[+d.dataset.i]); d.classList.toggle('ok', ok); d.querySelector('.st').textContent = ok ? '✓ preenchida' : ''; });
    SECS.forEach(function (s, i) { var c = document.getElementById('cnt_' + i); if (c) c.textContent = cntText(s.k[0]); });
    var r = document.getElementById('res'); if (r) r.innerHTML = resultHtml();
  }
  function saveT() { var e = document.getElementById('saveT'); if (e) e.textContent = saving ? 'Salvando…' : dirty ? 'Alterações ainda não salvas' : savedAt ? 'Salvo às ' + savedAt : ''; }
  function save(now) { clearTimeout(timer); if (!dirty && !now) return Promise.resolve(); saving = true; saveT(); return api({action: 'save', t: T, answers: A}).then(function (r) { saving = false; if (r.ok) { dirty = false; var d = new Date(); savedAt = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); } else msg(r.error || 'Não consegui salvar.', 'bad'); saveT(); return r; }, function () { saving = false; saveT(); msg('Sem conexão. Suas respostas ainda estão nesta tela.', 'bad'); }); }
  function later() { dirty = true; saveT(); clearTimeout(timer); timer = setTimeout(function () { save(); }, 1500); progress(); }
  function msg(t, k) { var m = document.getElementById('msg'); if (m) m.innerHTML = t ? '<div class="msg ' + (k || 'ok') + '">' + esc(t) + '</div>' : ''; }
  function openDoc(html) { var u = URL.createObjectURL(new Blob([html], {type: 'text/html'})); var w = window.open(u, '_blank'); if (!w) location.href = u; }
  function reportData() {
    var I = A.identidade || {}, ids = function (list, labs) { return (Array.isArray(labs) ? labs : []).map(function (l) { var x = list.filter(function (v) { return v[1].toLowerCase() === String(l).trim().toLowerCase(); })[0]; return x && x[0]; }).filter(Boolean); };
    var nm = function (l) { return Object.keys(ID_ARCHS).filter(function (k) { return ID_ARCHS[k].n.toLowerCase() === String(l || '').trim().toLowerCase(); })[0] || ''; };
    var lines = function (t) { return String(t || '').split(/\n|;/).map(function (x) { return x.trim(); }).filter(Boolean); };
    var tom = ['formal', 'humor', 'tecnico', 'calor', 'ousadia'].map(function (k) { return I['t_' + k]; }).filter(function (x) { return x && !/^Equilibrado$/.test(x); }).join(', ');
    return {nome: info.name, responsavel: (A.contato || {}).nome, data: new Date().toLocaleDateString('pt-BR'), values: (I.valores || []).concat(lines(I.valoresExtra)), attitudes: (I.atitudes || []).concat(lines(I.atitudesExtra)), valuesIds: ids(ID_VALUES, I.valores), attitudesIds: ids(ID_ATTS, I.atitudes), arch: nm(I.arq), arch2: nm(I.arq2), tom: tom,
      listas: [['O que fala', lines(I.fala)], ['O que NÃO fala', lines(I.naoFala)], ['Atitudes que tem', lines(I.atitudeTem)], ['Atitudes que NÃO tem', lines(I.atitudeNao)], ['O que admira', lines(I.admira)], ['O que repudia', lines(I.repudia)], ['Palavras que usa', lines(I.usa)], ['Palavras que NÃO usa', lines(I.naoUsa)]], refBrands: lines((A.referencias || {}).admira)};
  }
  root.addEventListener('input', function (e) { var p = e.target.getAttribute && e.target.getAttribute('data-p'); if (p) { put(p, e.target.value); later(); } });
  root.addEventListener('change', function (e) {
    var t = e.target, c = t.getAttribute && t.getAttribute('data-c');
    if (c) { var cur = val(c); cur = Array.isArray(cur) ? cur.slice() : []; var i = cur.indexOf(t.value); if (t.checked && i < 0) cur.push(t.value); if (!t.checked && i >= 0) cur.splice(i, 1); put(c, cur); later(); }
    else if (t.id === 'aceite') { A.aceite = t.checked; later(); } else if (t.tagName === 'SELECT') { later(); }
  });
  root.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button'); if (!b || b.classList.contains('ig-brand')) return;
    if (b.id === 'saveNow') save(true).then(function (r) { if (r && r.ok) msg('Salvo. Pode fechar e voltar depois neste mesmo link.', 'ok'); });
    else if (b.id === 'guide') openDoc(idGuideDoc());
    else if (b.id === 'rep') openDoc(idReportDoc(reportData()));
    else if (b.id === 'xlsx') { var u = URL.createObjectURL(xmBuild(mpSheets(A))), a = document.createElement('a'); a.href = u; a.download = 'marca-' + (info.name || 'cliente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-') + '.xlsx'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); }
    else if (b.id === 'send') {
      b.disabled = true; msg('Enviando…', 'ok');
      api({action: 'submit', t: T, answers: A}).then(function (r) { b.disabled = false; if (r.ok) { sent = true; dirty = false; render(true); window.scrollTo(0, 0); } else msg(r.error || 'Não consegui enviar.', 'bad'); }, function () { b.disabled = false; msg('Sem conexão. Tente de novo.', 'bad'); });
    }
  });
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  if (!/^[a-f0-9]{24}$/.test(T)) { root.innerHTML = '<div class="err"><h2>Link inválido</h2><p>Peça um novo link ao seu contato.</p></div>'; return; }
  api(null, true).then(function (r) {
    if (!r.ok) { root.innerHTML = '<div class="err"><h2>Não foi possível abrir</h2><p>' + esc(r.error || 'Link inválido.') + '</p></div>'; return; }
    if (r.kind !== 'marca') { location.replace('briefing.html?t=' + encodeURIComponent(T)); return; }
    info = r; A = r.answers && typeof r.answers === 'object' && !Array.isArray(r.answers) ? r.answers : {}; sent = r.status === 'enviado'; document.title = 'Marca' + (r.name ? ' · ' + r.name : ''); render(false);
  }, function () { root.innerHTML = '<div class="err"><h2>Sem conexão</h2><p>Não consegui falar com o servidor. Tente de novo em instantes.</p></div>'; });
})();
</script>
</body>
</html>
